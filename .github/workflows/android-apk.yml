name: Build Android APK

# 触发方式：
# 1) 手动：仓库页面 Actions → Build Android APK → Run workflow
# 2) 自动：push 到 main 分支，且改动落在下面这些路径里
#    （iOS 专属改动不会再白白触发一次安卓构建）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'VERSION'
      - 'CHANGELOG.md'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 说明：这里不再使用 android-actions/setup-android（上一个版本在这一步失败）。
      # ubuntu-latest 镜像自带 Android SDK，直接复用最稳，少一个第三方 action 就少一处失败点。
      # 如果镜像里找不到 SDK 或没有 sdkmanager，就自动下载 cmdline-tools 兜底。
      - name: 准备 Android SDK
        run: |
          set -uo pipefail

          SDK=""
          for candidate in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" \
                           /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "未发现预装 SDK，改为手动安装到 HOME"
            SDK="$HOME/android-sdk"
          fi
          mkdir -p "$SDK"
          echo "使用 SDK 目录：$SDK"

          SDKMGR=""
          if [ -d "$SDK/cmdline-tools" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1)"
          fi

          if [ -z "$SDKMGR" ]; then
            echo "SDK 里没有 sdkmanager，下载 cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir -p /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMGR" || true
          echo "sdkmanager：$SDKMGR"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"

          # 接受许可（必须在编译前完成，否则 AGP 无法自动补齐 platform / build-tools）
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          # 显式装好本项目需要的组件；已装过会秒过
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
            echo "---- sdkmanager 安装有告警，继续尝试编译（AGP 也可能自动补齐）----"

          echo "---- 已安装的 components（前 40 行）----"
          "$SDKMGR" --list_installed 2>/dev/null | head -n 40 || true

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 环境自检
        run: |
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: 读取版本号（与 iOS 共用根目录 VERSION）
        id: ver
        run: |
          if [ ! -f VERSION ]; then echo "缺少 VERSION 文件"; exit 1; fi
          M=$(grep -E '^MARKETING_VERSION=' VERSION | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          B=$(grep -E '^BUILD_NUMBER=' VERSION | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          echo "marketing=$M" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$M ($B)"

      - name: 编译 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          cd android/app/build/outputs/apk/debug
          ls -l
          cp app-debug.apk "PFC-android-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.apk"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: PFC-android-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: android/app/build/outputs/apk/debug/PFC-android-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          name: Android v${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})
          body: |
            Android 版本：v${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})

            下载 `PFC-android-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.apk`，
            传到手机上直接点击安装（需在系统里允许「安装未知来源应用」）。

            debug 签名，自用足够，没有 7 天过期问题。

            详细改动见仓库里的 CHANGELOG.md。
          files: android/app/build/outputs/apk/debug/PFC-android-*.apk
          make_latest: false
