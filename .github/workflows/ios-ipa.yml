name: Build iOS IPA

# 触发方式：
# 1) 手动：仓库页面 Actions → Build iOS IPA → Run workflow
# 2) 自动：push 到 main 分支
on:
  workflow_dispatch:
  push:
    branches: [main]

# 发布 Release 需要写权限（Release 里挂 IPA，方便手机/电脑下载，比 Artifacts 链接稳定）
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          if [ ! -f VERSION ]; then echo "缺少 VERSION 文件"; exit 1; fi
          M=$(grep -E '^MARKETING_VERSION=' VERSION | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          B=$(grep -E '^BUILD_NUMBER=' VERSION | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$M" ] || [ -z "$B" ]; then echo "VERSION 格式错误"; exit 1; fi
          echo "marketing=$M" >> "$GITHUB_OUTPUT"
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$M ($B)"

      - name: 列出可用 Xcode 并选最新
        run: |
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 构建无签名 IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: PFC-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: export/*.ipa
          if-no-files-found: error
          retention-days: 90

      # 把 IPA 挂到 Release 上，得到一个固定、免登录的下载地址
      # （Artifacts 链接需要登录且 90 天后过期；App 内已不再做「检查更新」）
      - name: 发布 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          name: v${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})
          body: |
            版本：v${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }})

            下载 `PFC-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}.ipa`，
            用 Sideloadly 签名安装即可覆盖升级（同 Bundle ID，不丢成绩）。

            详细改动见仓库里的 CHANGELOG.md。
          files: export/*.ipa
          make_latest: true
