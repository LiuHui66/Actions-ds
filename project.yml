name: PFC
options:
  bundleIdPrefix: com.liuhui66
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 锁定并发检查等级，避免不同 Xcode 版本默认值变化导致隔离相关的编译错误
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  PFC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PFC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuhui66.pfc
        PRODUCT_NAME: PFC
        # 真正的版本号在 VERSION 文件里，由 scripts/build-unsigned-ipa.sh 覆盖这两个值
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: 前额叶训练
        SWIFT_EMIT_LOC_STRINGS: YES
